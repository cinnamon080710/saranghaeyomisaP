<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>나여! 미사P!</title>
    <style>
        :root {
            --bg-color: #050a12;
            --card-bg: #0a1428;
            --accent-blue: #0072ff;
            --border-color: #1e2328;
            --text-gold: #c8aa6e;
        }

        body { 
            background-color: #1a1a1a; 
            color: #fff; 
            font-family: 'Black Han Sans', sans-serif;
            margin: 0; 
            display: flex;
            flex-direction: column;
            height: 100vh; 
            overflow: hidden; /* 전체 스크롤 차단 */
        }

        .hidden { display: none !important; }

        /* --- 1단계: 파칭코 화면 --- */
        #game-screen { 
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .game-box {
            width: 90%;
            max-width: 500px;
            border: 5px double #ffd700;
            padding: 30px;
            border-radius: 20px;
            background: linear-gradient(145deg, #222, #333);
            text-align: center;
            box-shadow: 0 0 20px rgba(255, 215, 0, 0.5);
        }

        .slot-machine { font-size: 80px; font-weight: bold; color: #ff0055; margin: 20px 0; }
        .pachinko-btn { padding: 15px 40px; font-size: 20px; cursor: pointer; background: #ffd700; border: none; border-radius: 50px; font-weight: bold; }

        /* --- 2단계: 결과 화면 (한 화면 꽉 채움) --- */
        #legacy-screen { 
            width: 100vw; 
            height: 100vh;
            display: flex; 
            flex-direction: column;
            background-color: var(--bg-color); 
        }

        .legacy-header {
            height: 60px; /* 헤더 높이 고정 */
            display: flex;
            align-items: center;
            justify-content: center;
            background: #000;
        }
        .legacy-title { font-size: 24px; margin: 0; color: #fff; }
        .legacy-title span { color: var(--accent-blue); }

        /* 카드 컨테이너: 가로 100%, 세로 나머지 전부 */
        .container { 
            flex: 1; 
            display: flex; 
            flex-direction: row; 
            width: 100%;
            overflow: hidden; /* 스크롤 절대 없음 */
            padding: 0;
            margin: 0;
            background: #000;
        }

        /* 각 카드 칸: 인원수에 따라 너비가 결정됨 */
        .roster-column { 
            flex: 1; /* ★ 핵심: 인원수대로 정확히 n분의 1씩 나눠가짐 */
            height: 100%; 
            border-right: 1px solid rgba(255,255,255,0.1);
            position: relative; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            justify-content: center; 
            transition: flex 0.4s ease; /* 호버 시 살짝 넓어지는 효과 */
            overflow: hidden;
        }

        .roster-column:hover { 
            flex: 1.5; /* 살짝 강조됨 */
            z-index: 2; 
        }

        .assign-btn { background: none; border: none; color: #5b6a71; cursor: pointer; display: flex; flex-direction: column; align-items: center; }
        .plus-icon { width: 30px; height: 30px; border: 1px solid currentColor; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 18px; margin-bottom: 5px; }
        .assign-text { font-size: 10px; font-weight: bold; }

        .filled-content { 
            width: 100%; height: 100%; 
            display: flex; flex-direction: column; justify-content: flex-end; 
            background-size: cover; 
            background-position: center top;
        }
        .player-info { 
            background: linear-gradient(to top, rgba(0,0,0,1) 0%, rgba(0,0,0,0) 100%);
            width: 100%; 
            padding: 50px 0 20px 0; 
            text-align: center; 
        }

        .member-label { color: var(--text-gold); font-size: 9px; letter-spacing:1px; margin-bottom:2px; }
        .player-name { 
            font-size: clamp(12px, 1.5vw, 18px); /* 인원 많아지면 글자 크기 조절 */
            font-weight: bold; 
            white-space: nowrap;
            padding: 0 5px;
        }
    </style>
</head>
<body>

    <div id="game-screen">
        <div class="game-box" id="start-area">
            <h1 style="margin:0 0 20px 0; color:#fff;">나여! 미사P!</h1>
            <button class="pachinko-btn" onclick="startSelection()">시작하기</button>
        </div>

        <div class="game-box hidden" id="select-area">
            <div id="status-text" style="color: #00ffcc;">멤버 수는 과연?</div>
            <div id="slot" class="slot-machine">?</div>
            <button id="draw-btn" class="pachinko-btn" onclick="runPachinko()">뽑기 시작!</button>
        </div>
    </div>

    <div id="legacy-screen" class="hidden">
        <div class="legacy-header">
            <h1 class="legacy-title">나여! <span>미사P!</span></h1>
        </div>
        <div class="container" id="roster-container"></div>
    </div>

    <script>
        const numbers = [7, 8, 9];
        let isRunning = false;
        let maxMembers = 0;

        const players = [
            { name: "FURUSAWA RISA", img: "후리.jpg" },
            { name: "SANO AIKA", img: "아이카.jpg" },
            { name: "ITAKURA KANA", img: "카나.jpg" },
            { name: "MASUDA AYANO", img: "아야노.jpg" },
            { name: "KAWAMOTO EMIRU", img: "에미루.jpg" },
            { name: "UMEDA MIYU", img: "미유.jpg" },
            { name: "MANABE NAGISA", img: "나베.jpg" },
            { name: "SAKURABA HARUKA", img: "파루.jpg" },
            { name: "TSUKIASHI AMANE", img: "아마네.jpg" },
            { name: "CHINZEI SUZUKA", img: "오스즈.jpg" },
            { name: "SAKURAI YUI", img: "유이.jpg" },
            { name: "NAKAGAWA LUNA", img: "루나.jpg" },
            { name: "MANAKA MANA", img: "마나.jpg" },
            { name: "MATSUMOTO KAREN", img: "카렌.jpg" },
            { name: "HAYASE NOEL", img: "노엘.jpg" },
            { name: "MURAKAWA BIBIAN", img: "비비.jpg" },
            { name: "KIRIHARA MIZUKI", img: "키리.jpg" },
            { name: "리노 이모", img: "리노.jpg" },
            { name: "OGAWA NANAKO", img: "나나코.jpg" },
            { name: "MINAMI NATSU", img: "나츠.jpg" },
            { name: "MIYANO SHIZUKA", img: "시즈카.jpg" },
            { name: "TACHIBANA KOTOMI", img: "콧짱.jpg" },
            { name: "OKUDA AYU", img: "아유.jpg" },
            { name: "OTOI YUI", img: "오유이.jpg" },
            { name: "KURATA NATSUKA", img: "나츠카.jpg" },
            { name: "SHIOKAWA RISE", img: "리세.jpg" },
            { name: "SHOJI NAGISA", img: "나규.jpg" },
            { name: "SHIRAISHI MAYUMI", img: "마유미.jpg" },
            { name: "YAMAUCHI SAKINA", img: "사키나.jpg" },
            { name: "ARAI COCONA", img: "코코나.jpg" },
            { name: "ENDO MARIN", img: "마린.jpg" },
            { name: "SASAHARA NANAKA", img: "나나카.jpg" },
            { name: "SUZUKI KARIN", img: "카린.jpg" },
            { name: "TAKANASHI YUNA", img: "유나.jpg" },
            { name: "NAKAYAMA KOHAKU", img: "코하쿠.jpg" },
            { name: "HAGITA SORA", img: "소라.jpg" },
            { name: "MORITA AMI", img: "아미.jpg" },
            { name: "YAMAMOTO RUSIA", img: "루시아.jpg" }
        ];

        function startSelection() {
            document.getElementById('start-area').classList.add('hidden');
            document.getElementById('select-area').classList.remove('hidden');
        }

        function runPachinko() {
            if (isRunning) return;
            isRunning = true;
            const slot = document.getElementById('slot');
            const btn = document.getElementById('draw-btn');
            btn.style.visibility = 'hidden';

            let count = 0;
            const shuffle = setInterval(() => {
                slot.innerText = numbers[Math.floor(Math.random() * numbers.length)];
                count++;
                if (count > 20) {
                    clearInterval(shuffle);
                    maxMembers = parseInt(slot.innerText);
                    isRunning = false;
                    setTimeout(() => transitionToLegacy(), 800);
                }
            }, 70); 
        }

        function transitionToLegacy() {
            document.getElementById('game-screen').classList.add('hidden');
            document.getElementById('legacy-screen').classList.remove('hidden');
            initRoster();
        }

        function initRoster() {
            const container = document.getElementById('roster-container');
            container.innerHTML = '';
            for (let i = 0; i < maxMembers; i++) {
                const col = document.createElement('div');
                col.className = 'roster-column';
                col.id = `slot-${i}`;
                col.innerHTML = `
                    <button class="assign-btn" onclick="assignRandomPlayer(${i})">
                        <div class="plus-icon">+</div>
                        <div class="assign-text">ASSIGN</div>
                    </button>
                `;
                container.appendChild(col);
            }
        }

        function assignRandomPlayer(index) {
            const currentSlot = document.getElementById(`slot-${index}`);
            if (currentSlot.querySelector('.filled-content')) return;

            const currentTeamNames = Array.from(document.querySelectorAll('.player-name'))
                                         .map(el => el.innerText);

            const availablePlayers = players.filter(p => !currentTeamNames.includes(p.name));

            if (availablePlayers.length === 0) return;

            const selectedPlayer = availablePlayers[Math.floor(Math.random() * availablePlayers.length)];

            currentSlot.innerHTML = `
                <div class="filled-content" style="background-image: url('${selectedPlayer.img}')">
                    <div class="player-info">
                        <div class="member-label">MEMBER</div>
                        <div class="player-name">${selectedPlayer.name}</div>
                    </div>
                </div>
            `;
        }
    </script>
</body>
</html>
