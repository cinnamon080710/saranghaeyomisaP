<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>나여! 미사P!</title>
    <style>
        :root {
            --bg-color: #050a12;
            --card-bg: #0a1428;
            --accent-blue: #0072ff;
            --border-color: #1e2328;
            --text-gold: #c8aa6e;
        }

        body { 
            background-color: #1a1a1a; 
            color: #fff; 
            font-family: 'Black Han Sans', sans-serif;
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            justify-content: flex-start; /* 상단부터 채우도록 */
            min-height: 100vh;
            margin: 0; 
            overflow-x: hidden;
        }

        .hidden { display: none !important; }

        /* --- 1단계: 파칭코 화면 스타일 --- */
        #game-screen { 
            margin-top: 10vh;
            text-align: center; 
            width: 90%; 
            max-width: 600px; 
            border: 5px double #ffd700; 
            padding: 40px 20px; 
            border-radius: 20px; 
            background: linear-gradient(145deg, #222, #333); 
            box-shadow: 0 0 20px rgba(255, 215, 0, 0.5); 
        }

        h1.main-title { 
            color: #ffffff; 
            text-shadow: 3px 3px #ff4500, 6px 6px rgba(0,0,0,0.5); 
            font-size: clamp(2rem, 8vw, 4rem); 
            margin: 0 0 30px 0; 
            transform: rotate(-7deg); 
            font-weight: 900;
        }

        .slot-machine { font-size: 80px; font-weight: bold; color: #ff0055; margin: 20px 0; text-shadow: 0 0 10px #ff0055; }
        .pachinko-btn { padding: 15px 40px; font-size: 22px; cursor: pointer; background: #ffd700; border: none; border-radius: 50px; font-weight: bold; box-shadow: 0 5px #b8860b; color: #000; }

        /* --- 2단계: 결과 화면 (반응형 그리드) --- */
        #legacy-screen { 
            width: 100%; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            background-color: var(--bg-color); 
            min-height: 100vh;
            padding-bottom: 50px;
        }
        .legacy-title { font-size: clamp(24px, 5vw, 40px); letter-spacing: 2px; margin: 30px 0; text-transform: uppercase; font-weight: 800; color: #fff; }
        .legacy-title span { color: var(--accent-blue); }

        .container { 
            display: flex; 
            flex-wrap: wrap; /* 핵심: 화면 좁으면 줄바꿈 */
            gap: 15px; 
            padding: 0 20px;
            width: 100%;
            max-width: 1400px; /* 너무 퍼지지 않게 제한 */
            justify-content: center; 
            box-sizing: border-box;
        }

        .roster-column { 
            flex: 1 1 calc(25% - 20px); /* 기본 한 줄에 4개 */
            min-width: 160px; 
            max-width: 280px; 
            aspect-ratio: 2 / 3; /* 카드 비율 고정 */
            background: linear-gradient(180deg, rgba(10, 20, 40, 0.5) 0%, rgba(5, 10, 20, 0.8) 100%); 
            border: 1px solid var(--border-color); 
            position: relative; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            justify-content: center; 
            transition: 0.3s; 
            overflow: hidden;
            border-radius: 10px;
        }
        
        /* 아이패드/태블릿용: 한 줄에 3개씩 */
        @media (max-width: 900px) {
            .roster-column { flex: 1 1 calc(33.333% - 20px); }
        }
        /* 모바일용: 한 줄에 2개씩 */
        @media (max-width: 500px) {
            .roster-column { flex: 1 1 calc(50% - 20px); min-width: 140px; }
        }

        .roster-column:hover { border-color: var(--accent-blue); box-shadow: 0 0 15px rgba(0, 114, 255, 0.4); }

        .assign-btn { background: none; border: none; color: #5b6a71; cursor: pointer; display: flex; flex-direction: column; align-items: center; }
        .plus-icon { width: 40px; height: 40px; border: 1px solid currentColor; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 20px; margin-bottom: 10px; }
        .assign-text { font-size: 11px; font-weight: bold; letter-spacing: 1px; }

        .filled-content { 
            width: 100%; height: 100%; 
            display: flex; flex-direction: column; justify-content: flex-end; 
            background-size: cover; background-position: center; 
        }
        .player-info { 
            background: rgba(0, 0, 0, 0.85); 
            width: 100%; padding: 12px 0; 
            text-align: center; border-top: 2px solid var(--accent-blue); 
        }

        /* 알림창 커스텀 스타일 */
        #modal { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); display: none; justify-content: center; align-items: center; z-index: 100; }
    </style>
</head>
<body>

    <div id="game-screen">
        <div id="start-area">
            <h1 class="main-title">나여!<br>미사P!</h1>
            <button class="pachinko-btn" onclick="startSelection()">시작하기</button>
        </div>

        <div id="select-area" class="hidden">
            <div id="status-text" style="color: #00ffcc; font-size: 20px;">인원 선택</div>
            <div id="slot" class="slot-machine">?</div>
            <button id="draw-btn" class="pachinko-btn" onclick="runPachinko()">뽑기 시작!</button>
        </div>
    </div>

    <div id="legacy-screen" class="hidden">
        <h1 class="legacy-title">나여! <span>미사P!</span></h1>
        <div class="container" id="roster-container"></div>
    </div>

    <script>
        const numbers = [7, 8, 9];
        let isRunning = false;
        let maxMembers = 0;

        const players = [
            { name: "FURUSAWA RISA", img: "후리.jpg" },
            { name: "SANO AIKA", img: "아이카.jpg" },
            { name: "ITAKURA KANA", img: "카나.jpg" },
            { name: "MASUDA AYANO", img: "아야노.jpg" },
            { name: "KAWAMOTO EMIRU", img: "에미루.jpg" },
            { name: "UMEDA MIYU", img: "미유.jpg" },
            { name: "MANABE NAGISA", img: "나베.jpg" },
            { name: "SAKURABA HARUKA", img: "파루.jpg" },
            { name: "TSUKIASHI AMANE", img: "아마네.jpg" },
            { name: "CHINZEI SUZUKA", img: "오스즈.jpg" },
            { name: "SAKURAI YUI", img: "유이.jpg" },
            { name: "NAKAGAWA LUNA", img: "루나.jpg" },
            { name: "MANAKA MANA", img: "마나.jpg" },
            { name: "MATSUMOTO KAREN", img: "카렌.jpg" },
            { name: "HAYASE NOEL", img: "노엘.jpg" },
            { name: "MURAKAWA BIBIAN", img: "비비.jpg" },
            { name: "KIRIHARA MIZUKI", img: "키리.jpg" },
            { name: "리노 이모", img: "리노.jpg" },
            { name: "OGAWA NANAKO", img: "나나코.jpg" },
            { name: "MINAMI NATSU", img: "나츠.jpg" },
            { name: "MIYANO SHIZUKA", img: "시즈카.jpg" },
            { name: "TACHIBANA KOTOMI", img: "콧짱.jpg" },
            { name: "OKUDA AYU", img: "아유.jpg" },
            { name: "OTOI YUI", img: "오유이.jpg" },
            { name: "KURATA NATSUKA", img: "나츠카.jpg" },
            { name: "SHIOKAWA RISE", img: "리세.jpg" },
            { name: "SHOJI NAGISA", img: "나규.jpg" },
            { name: "SHIRAISHI MAYUMI", img: "마유미.jpg" },
            { name: "YAMAUCHI SAKINA", img: "사키나.jpg" },
            { name: "ARAI COCONA", img: "코코나.jpg" },
            { name: "ENDO MARIN", img: "마린.jpg" },
            { name: "SASAHARA NANAKA", img: "나나카.jpg" },
            { name: "SUZUKI KARIN", img: "카린.jpg" },
            { name: "TAKANASHI YUNA", img: "유나.jpg" },
            { name: "NAKAYAMA KOHAKU", img: "코하쿠.jpg" },
            { name: "HAGITA SORA", img: "소라.jpg" },
            { name: "MORITA AMI", img: "아미.jpg" },
            { name: "YAMAMOTO RUSIA", img: "루시아.jpg" }
        ];

        function startSelection() {
            document.getElementById('start-area').classList.add('hidden');
            document.getElementById('select-area').classList.remove('hidden');
        }

        function runPachinko() {
            if (isRunning) return;
            isRunning = true;
            
            const slot = document.getElementById('slot');
            const btn = document.getElementById('draw-btn');
            const status = document.getElementById('status-text');

            btn.style.visibility = 'hidden';
            status.innerText = "그룹의 인원은...?";

            let count = 0;
            const shuffle = setInterval(() => {
                slot.innerText = numbers[Math.floor(Math.random() * numbers.length)];
                count++;

                if (count > 20) {
                    clearInterval(shuffle);
                    maxMembers = parseInt(slot.innerText);
                    slot.style.color = "#00ffcc";
                    status.innerText = "결정되었습니다!"; 
                    isRunning = false;
                    
                    setTimeout(() => {
                        transitionToLegacy();
                    }, 800);
                }
            }, 70); 
        }

        function transitionToLegacy() {
            document.getElementById('game-screen').classList.add('hidden');
            document.getElementById('legacy-screen').classList.remove('hidden');
            document.body.style.justifyContent = "flex-start"; 
            initRoster();
        }

        function initRoster() {
            const container = document.getElementById('roster-container');
            container.innerHTML = '';
            for (let i = 0; i < maxMembers; i++) {
                const col = document.createElement('div');
                col.className = 'roster-column';
                col.id = `slot-${i}`;
                col.innerHTML = `
                    <button class="assign-btn" onclick="assignRandomPlayer(${i})">
                        <div class="plus-icon">+</div>
                        <div class="assign-text">GROUP ASSIGN</div>
                    </button>
                `;
                container.appendChild(col);
            }
        }

        function assignRandomPlayer(index) {
            const currentSlot = document.getElementById(`slot-${index}`);
            if (currentSlot.querySelector('.filled-content')) return;

            const currentTeamNames = Array.from(document.querySelectorAll('.player-info div:last-child'))
                                         .map(el => el.innerText);

            const availablePlayers = players.filter(p => !currentTeamNames.includes(p.name));

            if (availablePlayers.length === 0) {
                alert("명단에 남은 선수가 없습니다!");
                return;
            }

            const selectedPlayer = availablePlayers[Math.floor(Math.random() * availablePlayers.length)];

            currentSlot.innerHTML = `
                <div class="filled-content" style="background-image: url('${selectedPlayer.img}')">
                    <div class="player-info">
                        <div style="color: var(--text-gold); font-size: 10px; letter-spacing:1px; margin-bottom:3px;">MEMBER</div>
                        <div style="font-size: clamp(14px, 2vw, 18px); font-weight: bold;">${selectedPlayer.name}</div>
                    </div>
                </div>
            `;
        }
    </script>
</body>
</html>
